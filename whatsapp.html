<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp Coexistence Launcher</title>
</head>

<body style="font-family: Arial, sans-serif; padding: 24px;">
  <h2>WhatsApp Coexistence</h2>

  <button
    id="waBtn"
    onclick="launchWhatsAppSignup()"
    style="background-color:#1877f2;border:0;border-radius:4px;color:#fff;cursor:pointer;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;height:40px;padding:0 24px;"
  >
    Start WhatsApp Coexistence
  </button>

  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    const APP_ID = "1259968159160475";
    const CONFIG_ID = "797659309527789";
    const GRAPH_API_VERSION = "v24.0";

    const N8N_WEBHOOK_URL = "https://fjuwaied.app.n8n.cloud/webhook/wa-es-capture";

    // Prevent spamming OAuth (rate limit)
    let WA_LOCK = false;

    // We store the WA embedded signup message here (contains waba_id / phone_number_id / business_id)
    let lastWaMessage = null;

    async function postToN8n(payload) {
      await fetch(N8N_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    window.fbAsyncInit = function () {
      FB.init({
        appId: APP_ID,
        autoLogAppEvents: true,
        xfbml: true,
        version: GRAPH_API_VERSION,
      });
    };

    // Capture the embedded signup message (assets)
    window.addEventListener("message", (event) => {
      if (!event.origin.endsWith("facebook.com")) return;

      try {
        const data = JSON.parse(event.data);
        if (data?.type === "WA_EMBEDDED_SIGNUP") {
          lastWaMessage = data; // store it so we can attach it to the code later
        }
      } catch {
        // ignore
      }
    });

    function fbLoginCallback(response) {
      const code = response?.authResponse?.code || null;

      // Send ONE object to n8n that includes BOTH code + assets together
      postToN8n({
        source: "wa_embedded_signup_bundle",
        received_at: new Date().toISOString(),
        code,
        wa: lastWaMessage
      });

      // unlock shortly after (avoid rate limit)
      setTimeout(() => { WA_LOCK = false; }, 20000);
      const btn = document.getElementById("waBtn");
      if (btn) btn.disabled = false;
    }

    function launchWhatsAppSignup() {
      if (WA_LOCK) return;
      WA_LOCK = true;

      const btn = document.getElementById("waBtn");
      if (btn) btn.disabled = true;

      lastWaMessage = null;

      FB.login(fbLoginCallback, {
        config_id: CONFIG_ID,
        response_type: "code",
        override_default_response_type: true,
        extras: {
          setup: {},
          featureType: "whatsapp_business_app_onboarding",
          sessionInfoVersion: "3"
        }
      });
    }
  </script>
</body>
</html>
