<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp Coexistence Launcher</title>
</head>

<body style="font-family: Arial, sans-serif; padding: 24px;">
  <h2>WhatsApp Coexistence</h2>

  <button
    onclick="launchWhatsAppSignup()"
    style="background-color:#1877f2;border:0;border-radius:4px;color:#fff;cursor:pointer;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;height:40px;padding:0 24px;"
  >
    Start WhatsApp Coexistence
  </button>

  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    /* ===================== CONFIG ===================== */
    const APP_ID = "1259968159160475";
    const CONFIG_ID = "797659309527789";
    const GRAPH_API_VERSION = "v24.0";

    const N8N_WEBHOOK_URL =
      "https://fjuwaied.app.n8n.cloud/webhook/wa-es-capture";

    /* ===================== POST TO N8N ===================== */
    async function postToN8n(payload) {
      try {
        await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Failed posting to n8n", e);
      }
    }

    /* ===================== FB INIT ===================== */
    window.fbAsyncInit = function () {
      FB.init({
        appId: APP_ID,
        autoLogAppEvents: true,
        xfbml: true,
        version: GRAPH_API_VERSION,
      });
    };

    /* ===================== SESSION LOGGING (ASSETS) ===================== */
    window.addEventListener("message", (event) => {
      if (!event.origin.endsWith("facebook.com")) return;

      try {
        const data = JSON.parse(event.data);

        if (data?.type === "WA_EMBEDDED_SIGNUP") {
          console.log("WA SIGNUP MESSAGE:", data);

          postToN8n({
            source: "embedded_signup_message",
            received_at: new Date().toISOString(),
            payload: data
          });
        }
      } catch {
        /* ignore non-json */
      }
    });

    /* ===================== LOGIN CALLBACK (CODE) ===================== */
    function fbLoginCallback(response) {
      if (response?.authResponse?.code) {
        console.log("OAUTH CODE:", response.authResponse.code);

        postToN8n({
          source: "embedded_signup_code",
          received_at: new Date().toISOString(),
          code: response.authResponse.code
        });
      } else {
        postToN8n({
          source: "embedded_signup_no_code",
          received_at: new Date().toISOString(),
          payload: response || null
        });
      }
    }

    /* ===================== LAUNCH ===================== */
    function launchWhatsAppSignup() {
      FB.login(fbLoginCallback, {
        config_id: CONFIG_ID,
        response_type: "code",
        override_default_response_type: true,
        extras: {
          setup: {},
          featureType: "whatsapp_business_app_onboarding",
          sessionInfoVersion: "3"
        }
      });
    }
  </script>
</body>
</html>
